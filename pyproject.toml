[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indtrader"
version = "0.1.0"
description = "LLM multi-agent (TradingAgents) algorithmic trading for Indian equities (NSE/BSE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@v0.7.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "typer>=0.12",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
zerodha = ["kiteconnect>=5.0"]
openalgo = ["openalgo>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
indtrader = "indtrader.cli:app"

[tool.setuptools.packages.find]
include = ["indtrader*"]

[tool.setuptools.package-data]
"indtrader.vibe" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
