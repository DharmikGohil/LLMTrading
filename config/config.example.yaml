# Copy to config/config.yaml and edit.  All money values are in rupees.

universe: [RELIANCE, TCS, HDFCBANK, INFY, ICICIBANK, BHARTIARTL, LT, ITC]
exchange: NSE
data_dir: state
dry_run: false            # true = log orders, never send them
extra_holidays: []        # add exchange holidays not in indtrader/market.py

llm:
  llm_provider: anthropic           # openai | google | anthropic | deepseek | ollama | openrouter | ...
  deep_think_llm: claude-opus-5-5   # Research/Portfolio managers
  quick_think_llm: claude-sonnet-5  # analysts, debaters, trader
  max_debate_rounds: 1
  max_risk_discuss_rounds: 1
  runs: 1                           # >1 = majority vote over N TradingAgents runs (N x cost)
  analysts: [market, social, news, fundamentals]
  fundamental_data_vendor: yfinance # SEC EDGAR only covers US filers

strategy:
  signal_mode: hybrid       # hybrid: momentum screen picks, LLM can only veto (best evidence)
                            # llm: LLM ratings on `universe` drive entries | factor: screen only
  llm_veto_min_confidence: 55
  llm_missing: hold         # a candidate without an LLM review is not bought
  results_blackout_days: 3  # no new buys just before results (NSE event calendar)
  avoid_surveillance: true  # skip ASM/GSM and trade-for-trade stocks
  rating_weights: {Buy: 1.0, Overweight: 0.75, Hold: null, Underweight: 0.25, Sell: 0.0}
  trend_filter: true      # only buy when close > EMA(trend_ema)
  trend_ema: 50
  rsi_max_entry: 75
  atr_stop_mult: 2.0
  take_profit_rr: 2.5
  max_signal_age_days: 3
  reentry_cooldown_days: 5   # no re-buy right after a stop-loss
  min_hold_days: 3           # rating-driven sells wait N days after entry (stops still fire)
  regime_filter: true        # Nifty below its 200-day average -> smaller new buys
  regime_index: "^NSEI"
  regime_sma: 200
  bear_market_scale: 0.5     # 0 = no new buys in a bear market

# Second opinion: HKUDS/Vibe-Trading multi-agent committee (install with scripts/install_vibe.sh).
# It can only block or shrink buys, never add risk or stop a sell.
second_opinion:
  enabled: false
  vibe_python: ~/vibe-venv/bin/python
  mode: veto                 # veto: block buys it rates Underweight/Sell | confirm: buy only if it also says Buy/Overweight
  min_confidence: 50
  on_missing: hold           # if it fails: hold (no new buys) | proceed (TradingAgents alone)
  only_when_bullish: true    # only ask it when TradingAgents wants to buy (saves cost)
  timeout_min: 45

risk:
  capital: 100000         # what the bot may deploy
  max_position_pct: 0.20
  risk_per_trade_pct: 0.01
  max_open_positions: 5
  max_per_sector: 2         # e.g. at most 2 pharma names at once
  max_gross_exposure_pct: 1.0
  max_daily_loss_pct: 0.03
  max_orders_per_day: 30
  min_order_value: 1000
  limit_buffer_pct: 0.003
  max_price_deviation_pct: 0.05

broker:
  name: paper             # paper | zerodha | openalgo
  product: CNC            # CNC (delivery, recommended) | MIS (intraday)
  paper_state_file: state/paper_account.json
  openalgo_host: http://127.0.0.1:5000
  strategy_tag: indtrader

schedule:                 # IST
  analysis_time: "08:30"
  execution_time: "09:30"
  monitor_interval_min: 5
  eod_time: "15:05"       # before the 15:15 closing auction (until 7 Dec 2026)

screen:                   # momentum + low-vol + trend screen (hybrid / factor modes)
  index: nifty200
  top_n: 12
  min_traded_value_cr: 20
  vol_exclude_pct: 0.2
  trend_template: false     # true = also require Minervini's SEPA trend template (stricter, fewer trades)

shadow_arms: [factor]     # paper "LLM off" control traded alongside; see `indtrader compare`
nse_checks: true          # surveillance, results calendar, splits/bonuses from nseindia.com

costs: {}                 # override any field of indtrader/costs.py:CostModel
