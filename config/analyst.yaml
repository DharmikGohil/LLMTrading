# Used by the scheduled Claude analyst (and shared with your trading machine).
# In hybrid mode the momentum screen chooses the candidates; the analyst reviews them.
exchange: NSE
data_dir: state
signals_dir: signals          # tracked in git: the analyst commits here, your machine pulls
screen:
  index: nifty200
  top_n: 10
  trend_template: true
strategy:
  signal_mode: hybrid
